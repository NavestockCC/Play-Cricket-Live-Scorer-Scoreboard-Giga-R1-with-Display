; PlatformIO Project Configuration File
;
; The Giga runs two firmwares, one per core, each flashed separately:
;   giga_r1_m7  -- src/m7/ + src/shared/: BLE input + Giga Display UI
;                  (LVGL + touch). Forwards scores to the M4, boots it and
;                  relays its debug lines to USB Serial.
;   giga_r1_m4  -- src/m4/ + src/shared/: 7-segment scoreboard output.
;                  (BLE can't run on the M4: the core's M4 build has no
;                  Bluetooth radio pins.)
; They talk over the core link (src/shared/core_link.h).
;
; Upload both after changing shared code: `pio run -t upload` does both
; (M7 first, then M4).

[platformio]
default_envs = giga_r1_m7, giga_r1_m4

[env]
; Pinned exactly: the platform supplies the Giga core (framework-arduino-mbed)
; and the toolchain, so a platform update can change how the firmware builds
; and runs. Bump deliberately and re-test on hardware.
platform = ststm32 @ 20.0.0
framework = arduino
monitor_speed = 115200

; Flash split between the cores: M7 gets 1.5MB, M4 gets 0.5MB starting at
; 0x08180000. MUST be the same in both envs -- it also tells the M7 where to
; boot the M4 firmware from.
board_build.arduino.flash_layout = 75_25

; BLE + display firmware (M7 core) -- release build, use for real matches.
[env:giga_r1_m7]
board = giga_r1_m7
build_src_filter = +<m7/> +<shared/>
; 1.5MB minus the 256KB bootloader -- the board file's default assumes 50_50.
board_upload.maximum_size = 1310720

; Point LVGL at this project's config (see src/m7/GigaDisplay/scoreboard_lv_conf.h
; for why it isn't simply named lv_conf.h)
build_flags =
    -I src
    -I src/m7
    -I src/m7/GigaDisplay
    '-DLV_CONF_PATH="scoreboard_lv_conf.h"'

; Required libraries for BLE and the GIGA Display
lib_deps =
    arduino-libraries/ArduinoBLE @ ^2.1.0
    arduino-libraries/Arduino_GigaDisplayTouch
    Arduino_H7_Video
    ArduinoGraphics
    ; Pinned exactly: LVGL releases have changed behaviour under the Giga
    ; core's bundled LVGL config before (9.6.0 needs Arm-2D switched off, see
    ; scoreboard_lv_conf.h). 9.6 is the last 9.x release -- 10.0 removes
    ; everything 9.6 marks deprecated. Bump deliberately and re-test on hardware.
    lvgl/lvgl @ 9.6.0

; Debug build of the M7 firmware -- adds per-message BLE logging (DEBUG_BLE,
; see m7/bluetooth/Ble_input.cpp) to USB Serial. Only use while a serial
; monitor is attached: without one, Serial writes can stall and freeze the
; touchscreen (BLE itself keeps running on its own thread).
[env:giga_r1_m7_debug]
extends = env:giga_r1_m7
build_flags =
    ${env:giga_r1_m7.build_flags}
    -DDEBUG_BLE

; Scoreboard firmware (M4 core).
[env:giga_r1_m4]
board = giga_r1_m4
build_src_filter = +<m4/> +<shared/>
board_upload.maximum_size = 524288

build_flags =
    -I src
    -I src/m4
