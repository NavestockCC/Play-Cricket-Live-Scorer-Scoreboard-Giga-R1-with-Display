; PlatformIO Project Configuration File

[env:giga_r1_m7]
platform = ststm32
board = giga_r1_m7
framework = arduino

; Force 100% Flash allocation to the M7 core so large graphics libraries fit
board_build.arduino.flash_layout = 100_0

; Inject flags to prioritize your local lv_conf.h
build_flags =
    -I src/GigaDisplay
    -DLV_CONF_INCLUDE_SIMPLE

; Required libraries for the GIGA Display
lib_deps =
    arduino-libraries/ArduinoBLE @ ^1.4.0
    Arduino_H7_Video
    ArduinoGraphics
    lvgl/lvgl @ ^9.2.2

monitor_speed = 115200
