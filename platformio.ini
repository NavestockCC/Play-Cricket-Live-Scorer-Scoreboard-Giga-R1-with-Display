; PlatformIO Project Configuration File
;
; The Giga runs two firmwares, one per core, each flashed separately:
;   giga_r1_m7  -- src/m7/ + src/shared/: Giga Display UI (LVGL + touch).
;                  Boots the M4 and relays its debug lines to USB Serial.
;   giga_r1_m4  -- src/m4/ + src/shared/: BLE input + 7-segment scoreboard.
; They talk over the core link (src/shared/core_link.h).
;
; Upload both after changing shared code: `pio run -t upload` does both
; (M7 first, then M4).

[platformio]
default_envs = giga_r1_m7, giga_r1_m4

[env]
platform = ststm32
framework = arduino
monitor_speed = 115200

; Flash split between the cores: M7 gets 1.5MB, M4 gets 0.5MB starting at
; 0x08180000. MUST be the same in both envs -- it also tells the M7 where to
; boot the M4 firmware from.
board_build.arduino.flash_layout = 75_25

; Display firmware (M7 core).
[env:giga_r1_m7]
board = giga_r1_m7
build_src_filter = +<m7/> +<shared/>
; 1.5MB minus the 256KB bootloader -- the board file's default assumes 50_50.
board_upload.maximum_size = 1310720

; Point LVGL at this project's config (see src/m7/GigaDisplay/scoreboard_lv_conf.h
; for why it isn't simply named lv_conf.h)
build_flags =
    -I src
    -I src/m7
    -I src/m7/GigaDisplay
    '-DLV_CONF_PATH="scoreboard_lv_conf.h"'

; Required libraries for the GIGA Display
lib_deps =
    arduino-libraries/Arduino_GigaDisplayTouch
    Arduino_H7_Video
    ArduinoGraphics
    ; Pinned exactly: newer LVGL releases have changed behaviour under the Giga
    ; core's bundled LVGL config (e.g. 9.6.0 tries to build Arm-2D support).
    ; Bump deliberately and re-test on hardware.
    lvgl/lvgl @ 9.5.0

; BLE + scoreboard firmware (M4 core) -- release build, use for real matches.
[env:giga_r1_m4]
board = giga_r1_m4
build_src_filter = +<m4/> +<shared/>
board_upload.maximum_size = 524288

build_flags =
    -I src
    -I src/m4

lib_deps =
    arduino-libraries/ArduinoBLE @ ^1.4.0

; Debug build of the M4 firmware -- adds per-message BLE logging (DEBUG_BLE,
; see m4/bluetooth/Ble_input.cpp), printed by the M7 to USB Serial. Only use
; while a serial monitor is attached: without one, the M7's Serial writes
; can stall and freeze the touchscreen.
[env:giga_r1_m4_debug]
extends = env:giga_r1_m4
build_flags =
    ${env:giga_r1_m4.build_flags}
    -DDEBUG_BLE
