; M4 Bluetooth feasibility test.
;
; Question: can ArduinoBLE run on the Giga's M4 core well enough for the
; Play Cricket app to connect and send scores? If yes, the main project can
; move BLE + scoreboard output to the M4 and keep the display on the M7.
;
; Two firmwares, flashed separately:
;   m7 -- boots the M4, relays its RPC messages to USB serial
;   m4 -- runs BLE ("PlayCricketScorer", same UUIDs as the real scoreboard)
;
; Both must use the same flash_layout: it decides where the M7 looks for
; the M4 firmware (75_25 = M7 gets 1.5MB, M4 gets 0.5MB at 0x08180000).

[env]
platform = ststm32
framework = arduino
board_build.arduino.flash_layout = 75_25
monitor_speed = 115200

[env:m7]
board = giga_r1_m7
build_src_filter = +<m7/>

[env:m4]
board = giga_r1_m4
build_src_filter = +<m4/>
lib_deps =
    arduino-libraries/ArduinoBLE @ ^1.4.0
